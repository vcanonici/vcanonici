<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Vinicius Canonici — neon city banner</title>
<style>@font-face{font-family:Orbitron;src:url('../assets/Orbitron.ttf')}*{box-sizing:border-box}body{margin:0;background:#080d24;color:#f3f6ff;font-family:system-ui}canvas{display:block;width:100%;height:auto;max-width:1200px;margin:0 auto}p{max-width:70ch;margin:24px auto;padding:0 20px}a{color:#00e5ff}</style>
<canvas width="1200" height="400" aria-label="Vinicius Canonici, with cyan and magenta neon illuminating a futuristic city"></canvas>
<p>Original city artwork with a eight-second blue-and-pink lightning loop. <a href="../assets/banner-static.png">Static version</a>.</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const city=new Image();city.src='../assets/cyberpunk-city.png';
const frames=200,duration=8000;
const ready=Promise.all([city.decode(),document.fonts.load('700 54px Orbitron')]).then(prepareScene);
let low,blue,pink;
function rgbToHsl(r,g,b){
 r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,l=(max+min)/2;
 if(!d)return[0,0,l];const s=d/(1-Math.abs(2*l-1));let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return[(h*60+360)%360,s,l];
}
function hslToRgb(h,s,l){
 const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
 const v=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return v.map(n=>Math.round((n+m)*255));
}
function distance(a,b){return Math.abs(((a-b+540)%360)-180)}
function layer(){const c=document.createElement('canvas');c.width=1200;c.height=400;return c}
function prepareScene(){
 const source=layer(),sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(city,0,0,1200,400);
 const original=sc.getImageData(0,0,1200,400);low=layer();blue=layer();pink=layer();
 const lo=new ImageData(1200,400),bl=new ImageData(1200,400),pk=new ImageData(1200,400);
 for(let i=0;i<original.data.length;i+=4){
  const [h,s,l]=rgbToHsl(...original.data.slice(i,i+3));
  const saturation=Math.min(1,Math.max(0,(s-.12)/.38));
  const b=Math.max(0,1-distance(h,212)/72)*saturation,p=Math.max(0,1-distance(h,310)/70)*saturation;
  const base=hslToRgb((h-8*b+8*p+360)%360,s,Math.max(0,l*(.86-.17*Math.max(b,p))));
  const bHigh=hslToRgb((h+19)%360,Math.min(1,s*1.12),Math.min(.91,l*1.26+.085));
  const pHigh=hslToRgb((h-20+360)%360,Math.min(1,s*1.12),Math.min(.91,l*1.26+.085));
  lo.data.set([...base,255],i);bl.data.set([...bHigh,Math.round(255*b)],i);pk.data.set([...pHigh,Math.round(255*p)],i);
 }
 low.getContext('2d').putImageData(lo,0,0);blue.getContext('2d').putImageData(bl,0,0);pink.getContext('2d').putImageData(pk,0,0);
}
function smooth(x){return x*x*x*(x*(x*6-15)+10)}
function thunder(seconds,start,rise,hold,fall){
 const t=seconds-start;if(t<0||t>=rise+hold+fall)return 0;
 if(t<rise)return smooth(t/rise);if(t<rise+hold)return 1;return 1-smooth((t-rise-hold)/fall);
}
function render(t=0){
 const seconds=t*duration/1000;
 const cyan=thunder(seconds,1,.65,.08,1.55),magenta=thunder(seconds,4.55,.75,.08,1.6);
 ctx.globalAlpha=1;ctx.drawImage(low,0,0);
 // Hue and luminance changes affect every matching pixel, including sky and reflections.
 ctx.globalAlpha=cyan;ctx.drawImage(blue,0,0);ctx.globalAlpha=magenta;ctx.drawImage(pink,0,0);ctx.globalAlpha=1;
 const shade=ctx.createRadialGradient(600,210,45,600,210,355);shade.addColorStop(0,'rgba(8,13,36,.48)');shade.addColorStop(.72,'rgba(8,13,36,.18)');shade.addColorStop(1,'rgba(8,13,36,0)');ctx.fillStyle=shade;ctx.fillRect(0,0,1200,400);
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 54px Orbitron';
 for(const [color,alpha,blur] of [['#00e5ff',.48,18],['#ff2aa1',.42,14]]){
  ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.strokeText('Vinicius Canonici',600,191);
 }
 ctx.globalAlpha=1;ctx.shadowBlur=4;ctx.shadowColor='#77eaff';ctx.fillStyle='#f3f6ff';ctx.fillText('Vinicius Canonici',600,191);
 ctx.shadowBlur=0;ctx.font='20px monospace';ctx.fillStyle='#a8f3ff';ctx.fillText('@vcanonici',600,247);ctx.restore();
}
window.exportLayers=async()=>{await ready;for(const [i,c] of [[200,low],[201,blue],[202,pink]]){const blob=await new Promise(r=>c.toBlob(r,'image/png'));const response=await fetch('/__frame/'+i,{method:'POST',body:blob});if(!response.ok)throw Error('Layer export failed')}return{layers:3}};
window.renderBanner=async t=>{await ready;render(t)};
window.exportBanner=async function(){await ready;for(let i=0;i<frames;i++){render(i/frames);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const r=await fetch('/__frame/'+String(i).padStart(3,'0'),{method:'POST',body:blob});if(!r.ok)throw Error('Frame export failed '+i);}render(.15);return{frames,width:1200,height:400,duration}};
ready.then(()=>{if(location.search.includes('still')||matchMedia('(prefers-reduced-motion: reduce)').matches){render(.15);return}const start=performance.now();function animate(now){render(((now-start)%duration)/duration);requestAnimationFrame(animate)}requestAnimationFrame(animate)});
</script></html>
